{% extends "base.html" %}
{% block title %}Set New Password — RoomSetu{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-sm p-6 sm:p-8">
        <div class="mb-6 text-center">
            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-black text-slate-900">Set New Password</h1>
            <p class="text-xs text-slate-500 mt-1">Apna naya aur strong password enter karein</p>
        </div>

        <form method="POST" action="{{ url_for('auth_bp.reset_password') }}" class="space-y-4">
            <!-- Hidden field for Supabase token extracted by JS below -->
            <input type="hidden" id="access_token" name="access_token" value="">

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1" for="password">New Password (Min 8 characters)</label>
                <input type="password" id="password" name="password" required minlength="8" placeholder="••••••••"
                       class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm text-slate-900 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1" for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="8" placeholder="••••••••"
                       class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm text-slate-900 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <button type="submit"
                    class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm shadow-sm transition">
                Change Password
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", () => {
    // Supabase URL hash (#access_token=...&refresh_token=...) se access token nikalna
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const token = params.get("access_token");

    if (token) {
        document.getElementById("access_token").value = token;
    } else {
        // Agar token na mile toh alert
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get("code");
        if (!code && !token) {
            console.warn("No recovery token found in URL hash.");
        }
    }
});
</script>
{% endblock %}
