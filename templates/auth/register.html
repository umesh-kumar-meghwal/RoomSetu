{% extends "base.html" %}
{% block title %}Register Account - RoomSetu{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-lg bg-white border border-slate-200 rounded-xl shadow-sm p-6 sm:p-8">
        <div class="mb-6 text-center">
            <h1 class="text-2xl font-bold text-slate-900">Create RoomSetu Account</h1>
            <p class="text-sm text-slate-500 mt-1">Connect with verified student rooms across India</p>
        </div>

        <form method="POST" action="{{ url_for('auth_bp.register') }}" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1" for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" required value="{{ form_data.get('full_name', '') }}"
                       class="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-900"
                       placeholder="Rohit Sharma">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1" for="email">Email Address</label>
                    <input type="email" id="email" name="email" required value="{{ form_data.get('email', '') }}"
                           class="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-900"
                           placeholder="rohit@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1" for="phone">Phone (10 Digits)</label>
                    <input type="tel" id="phone" name="phone" required pattern="[6-9][0-9]{9}" value="{{ form_data.get('phone', '') }}"
                           class="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-900"
                           placeholder="9876543210">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1" for="password">Password (min 8 chars)</label>
                <input type="password" id="password" name="password" required minlength="8"
                       class="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-900"
                       placeholder="••••••••">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Account Role</label>
                <div class="grid grid-cols-2 gap-4 mt-1">
                    <label class="flex items-center p-3 border border-slate-300 rounded-lg cursor-pointer hover:bg-slate-50 transition">
                        <input type="radio" name="role" value="STUDENT" class="text-indigo-600 focus:ring-indigo-500" {% if form_data.get('role', 'STUDENT') == 'STUDENT' %}checked{% endif %}>
                        <span class="ml-2 text-sm font-medium text-slate-800">Student</span>
                    </label>
                    <label class="flex items-center p-3 border border-slate-300 rounded-lg cursor-pointer hover:bg-slate-50 transition">
                        <input type="radio" name="role" value="LANDLORD" class="text-indigo-600 focus:ring-indigo-500" {% if form_data.get('role') == 'LANDLORD' %}checked{% endif %}>
                        <span class="ml-2 text-sm font-medium text-slate-800">Landlord / Owner</span>
                    </label>
                </div>
            </div>

            <button type="submit"
                    class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-sm transition">
                Continue to Verification
            </button>
        </form>

        <p class="text-center text-sm text-slate-600 mt-6">
            Already registered? 
            <a href="{{ url_for('auth_bp.login') }}" class="text-indigo-600 font-medium hover:underline">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
