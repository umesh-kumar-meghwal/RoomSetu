{% extends "base.html" %}
{% block title %}Forgot Password - RoomSetu{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-xl shadow-sm p-6 sm:p-8">
        <h1 class="text-2xl font-bold text-slate-900 text-center">Reset Password</h1>
        <p class="text-sm text-slate-600 text-center mt-1 mb-6">Enter your registered email address to receive recovery instructions.</p>

        <form method="POST" action="{{ url_for('auth_bp.forgot_password') }}" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1" for="email">Account Email</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-3.5 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-900"
                       placeholder="student@example.com">
            </div>
            <button type="submit"
                    class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-sm transition">
                Send Reset Link
            </button>
        </form>

        <p class="text-center text-sm text-slate-600 mt-6">
            Remembered your password? 
            <a href="{{ url_for('auth_bp.login') }}" class="text-indigo-600 font-medium hover:underline">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
