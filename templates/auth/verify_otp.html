{% extends "base.html" %}
{% block title %}Verify Email - RoomSetu{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-xl shadow-sm p-6 sm:p-8 text-center">
        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-slate-900">Verify Your Email</h1>
        <p class="text-sm text-slate-600 mt-1 mb-6">Enter the 6-digit confirmation code dispatched to <strong>{{ email }}</strong></p>

        <form method="POST" action="{{ url_for('auth_bp.verify_otp') }}" class="space-y-4">
            <input type="hidden" name="email" value="{{ email }}">
            <div>
                <input type="text" name="token" required maxlength="8"
                       class="w-full px-4 py-3 text-center tracking-widest text-2xl font-mono border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                       placeholder="123456">
            </div>
            <button type="submit"
                    class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-sm transition">
                Confirm Code
            </button>
        </form>
    </div>
</div>
{% endblock %}
