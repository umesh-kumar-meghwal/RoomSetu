<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RoomSetu - India's Student Rental Platform{% endblock %}</title>
    <meta name="google-site-verification" content="56somAV5JLe4x0VZypS-0VRWihFoZ29g5b6Pk5BZ1cA" />
    <!-- Tailwind CSS via CDN -->
     <link rel="icon" href="https://room-setu.vercel.app/static/image/logo.png">


<!-- ================= SEO META TAGS ================= -->
    <meta name="description" content="RoomSetu — India's #1 Zero Brokerage Student Room & PG Rental Platform. Find verified single rooms, sharing PGs, flats, and hostels near coaching institutes & colleges in Kota, Pune, Delhi NCR, Bengaluru & Dehradun. 100% verified owners, live GPS map radar, transparent house rules, and zero hidden charges.">
    
    <meta name="keywords" content="student room rental india, student pg near me, zero brokerage pg, rooms in kota for students, allen coaching pg kota, student accommodation pune, flats for students delhi university, sharing room near college, student hostel finder, single room for rent monthly, pg without brokerage, roomsetu, student rental platform india">
    
    <meta name="author" content="RoomSetu Technologies">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <link rel="canonical" href="{{ request.base_url }}">
    

    <!-- Open Graph (OG) Meta Tags / Social Media Preview (WhatsApp, Telegram, Facebook, LinkedIn) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="RoomSetu">
    <meta property="og:title" content="{% block og_title %}RoomSetu — India's Zero Brokerage Student Rental & PG Platform{% endblock %}">
    <meta property="og:description" content="Discover verified student rooms, sharing PGs, and hostels near top coaching hubs and universities across India with zero brokerage fees.">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:image" content="https://placehold.co/1200x630/4f46e5/ffffff?text=RoomSetu+Student+Housing">
    <meta property="og:locale" content="en_IN">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@RoomSetu">
    <meta name="twitter:title" content="RoomSetu — Zero Brokerage Student Room & PG Finder">
    <meta name="twitter:description" content="Explore verified rooms near colleges & coaching centres with direct landlord connection & live map search.">
    <meta name="twitter:image" content="https://placehold.co/1200x630/4f46e5/ffffff?text=RoomSetu+Student+Housing">

    <!-- Mobile Theme Color -->
    <meta name="theme-color" content="#4f46e5">
    <!-- ================= END SEO META TAGS ================= -->



    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    {% block head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans antialiased">
    {% include "partials/navbar.html" %}
    {% include "partials/flash_messages.html" %}

    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    {% block scripts %}{% endblock %}
</body>
</html>
