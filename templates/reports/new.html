{% extends "base.html" %}
{% block title %}Report Listing - RoomSetu{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="mb-6">
        <h1 class="text-2xl font-black text-slate-900">Report Listing or Incident</h1>
        <p class="text-sm text-slate-500 mt-1">Help keep RoomSetu safe and accurate for students across India</p>
    </div>

    <form method="POST" action="{{ url_for('reports_bp.submit_report') }}" class="bg-white border border-slate-200 rounded-xl p-6 sm:p-8 shadow-sm space-y-6">
        <input type="hidden" name="property_id" value="{{ property_id or '' }}">
        <input type="hidden" name="room_id" value="{{ room_id or '' }}">

        <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1" for="reason">Primary Reason</label>
            <select id="reason" name="reason" required class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm text-slate-900 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <option value="MISLEADING_PRICING">Misleading Pricing / Hidden Charges</option>
                <option value="FAKE_PHOTOS">Fake or Stolen Images</option>
                <option value="INACCURATE_LOCATION">Wrong Pin / Inaccurate GPS Location</option>
                <option value="ALREADY_OCCUPIED">Room is Already Occupied / Unavailable</option>
                <option value="ILLEGAL_RESTRICTIONS">Unlawful or Discriminatory Tenancy Terms</option>
                <option value="HARASSMENT">Owner Misconduct / Harassment</option>
                <option value="OTHER">Other Reason</option>
            </select>
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1" for="description">Detailed Description</label>
            <textarea id="description" name="description" rows="4" required minlength="10"
                      placeholder="Please explain what you observed (e.g., owner demanded higher deposit than listed, location is in a different sector, etc.)."
                      class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm text-slate-900 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
            <p class="text-xs text-slate-400 mt-1">Our moderation team reviews reports within 24 hours.</p>
        </div>

        <div class="pt-4 border-t border-slate-200 flex justify-end gap-3">
            <a href="{{ request.referrer or url_for('properties_bp.browse') }}" class="px-4 py-2 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 rounded-lg text-sm font-semibold transition">
                Cancel
            </a>
            <button type="submit" class="px-5 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-semibold shadow-sm transition">
                Submit Report
            </button>
        </div>
    </form>
</div>
{% endblock %}
