{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 space-y-2">
      {% for category, message in messages %}
        <div class="p-4 rounded-lg text-sm font-medium flex items-center justify-between border shadow-sm
            {% if category == 'success' %} bg-emerald-50 text-emerald-800 border-emerald-200
            {% elif category == 'danger' %} bg-red-50 text-red-800 border-red-200
            {% elif category == 'warning' %} bg-amber-50 text-amber-800 border-amber-200
            {% else %} bg-indigo-50 text-indigo-800 border-indigo-200 {% endif %}">
          <span>{{ message }}</span>
          <button type="button" onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-700 font-bold ml-4">✕</button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
